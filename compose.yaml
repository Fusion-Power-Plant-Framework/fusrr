version: "3"
services:
  fusrr:
    # image: fusrr:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fusrr-v0.1 # will make this a variable in the future
    security_opt:
      - seccomp:unconfined #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SUBFOLDER=/ #optional
    volumes:
      - .:/code
    ports:
      - 3000:3000
      - 3001:3001
    restart: unless-stopped
