[project]
name = "renderingpipline"
authors = [{name="The renderingpipline team"}]
description = """A tool to render"""
readme = "README.md"
requires-python = ">=3.10"
version = "0.0.0a1"
classifiers=[
        "Development Status :: 5 - Production/Stable",
        "Programming Language :: Python :: 3",
        "License :: OSI Approved :: MIT",
        "Operating System :: POSIX :: Linux",
    ]
dependencies = [
    "bpy",
    #"process",  # TODO install PROCESS once opensource?
    "tabulate"
]


[project.urls]
homepage = "https://github.com/Fusion-Power-Plant-Framework/rendingpipline"
documentation = "https://github.com/Fusion-Power-Plant-Framework/rendingpipline"
repository = "https://github.com/Fusion-Power-Plant-Framework/rendingpipline"

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "flake8-absolute-import",
    "flake8-bandit",
    "flake8-docstrings",
    "pep8-naming",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-html",
    "pytest-metadata",
    "pytest-json-report",
]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["renderingpipline*"]
exclude = ["tests*"]

[tool.black]
line-length = 89
include = '\.pyi?$'
extend-exclude = '\.env'

[tool.coverage.report]
"exclude_lines" = [
  "if __name__ == .__main__.:"
]

[tool.isort]
line_length = 89
profile = "black"
skip_gitignore = true
known_first_party = ["renderingpipline"]

[tool.pytest.ini_options]
markers = []
addopts = "--html=report.html --self-contained-html --strict-markers -r fEX"
