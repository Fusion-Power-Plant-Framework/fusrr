name: FusRR CI - PR Update

on: [pull_request]

env:
  IMAGE_NAME_W_SHA: "fusrr/fusrr:${{ github.sha }}"
  IMAGE_NAME_LATEST: "fusrr/fusrr:latest"

jobs:
  lint:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup python and Hatch
        uses: ./.github/actions/setup-hatch
      - name: Run Hatch linting tasks
        uses: ./.github/actions/hatch-lint

  build_image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build FusRR Docker image
        uses: ./.github/actions/build_docker_image
        with:
          image_name_latest: ${{ env.IMAGE_NAME_W_SHA }}
          image_name_sha: ${{ env.IMAGE_NAME_LATEST }}

  run_tests:
    runs-on: ubuntu-latest
    needs: build_image
    steps:
      - name: Run tests in Docker
        run: |
          docker run --rm -e FUSRR_RUN_TYPE=tests ${{ env.IMAGE_NAME_W_SHA }}

  run_examples:
    runs-on: ubuntu-latest
    needs: build_image
    steps:
      - name: Run tests in Docker
        run: |
          docker run --rm -e FUSRR_RUN_TYPE=examples ${{ env.IMAGE_NAME_W_SHA }}
