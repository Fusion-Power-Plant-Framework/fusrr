name: setup-hatch
description: Sets up Hatch for use in the current workflow, supports pip caching and py3.13
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
      with:
        python-version: |
          3.13.0
          3.13.1
          3.13.2
          3.13.3
          3.13.4
          3.13.5
          3.13.6
          3.13.7
          3.13.8
        cache: pip

    - name: Install build dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install hatch
