name: FusRR CI - PR Update

on: [pull_request]
jobs:
  run_tests:
    runs-on: ubuntu-latest
    env:
      DOCKER_TAG_SHA: fusrr/fusrr:${{ github.sha }}
      DOCKER_TAG_LATEST: fusrr/fusrr:latest
    steps:
      - name: Build FusRR Docker Image
        uses: ./.github/workflows/actions/build_docker_image

      - name: Run tests in Docker
        run: |
          docker run --rm ${{ env.DOCKER_TAG_SHA }}
