name: PR

on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_TAG_SHA: fusrr/fusrr:${{ github.sha }}
      DOCKER_TAG_LATEST: fusrr/fusrr:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.DOCKER_TAG_LATEST }}, ${{ env.DOCKER_TAG_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in Docker
        run: |
          docker run --rm ${{ env.DOCKER_TAG_SHA }}
