name: rendering_ci

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - blender-tests-on-ci

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      DISPLAY: ":0.0"

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'pyproject.toml'

    - name: Setup Environment
      run: pip install -e ".[dev]"

    - name: Install apt deps
      run: sudo apt-get install -y libgl1
    
    - name: Test
      run: |
        echo $DISPLAY
        pytest tests
    
    - name: Check Code Quality
      run: |
        SKIP=black pre-commit run --all-files
        flake8 --count
        black --check .
