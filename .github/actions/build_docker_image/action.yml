name: Build FusRR Docker Image
description: Builds the FusRR Docker Image with latest and commit sha tags
inputs:
  image_name:
    description: "The name of the Docker image to build"
    required: true
    default: "fusrr/fusrr"

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        load: true
        tags: ${{ inputs.image_name }}:latest, ${{ inputs.image_name }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
